    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const max_size = 500;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > max_size) { height *= max_size / width; width = max_size; }
            } else {
              if (height > max_size) { width *= max_size / height; height = max_size; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
        };
      });
    }

    // جلب الإعدادات

    async function saveStoreSettings() {
      const name = document.getElementById('setting-store-name').value;
      const desc = document.getElementById('setting-store-desc').value;
      let logo = document.getElementById('setting-logo-url').value;
      const newPass = document.getElementById('setting-new-pass').value;
      const logoFileInput = document.getElementById('setting-logo-file');

      if (logoFileInput.files[0]) {
        logo = await compressImage(logoFileInput.files[0]);
      }

      const settingsData = {};
      if (name) settingsData.name = name;
      if (desc) settingsData.desc = desc;
      if (logo) settingsData.logo = logo;
      if (newPass) {
        settingsData.pass = newPass;
        currentAdminPass = newPass;
        localStorage.setItem('adminPass', newPass);
      }

      await setDoc(doc(db, "settings", "store_info"), settingsData, { merge: true });
      alert("تم تحديث إعدادات المحل بنجاح! 🎉");
      document.getElementById('setting-new-pass').value = '';
    }

    // جلب كل المنتجات القديمة والجديدة
    onSnapshot(collection(db, "products"), (snapshot) => {

        const data = docSnap.data();
        // التأكد من وجود قسم حتى للمنتجات القديمة
        data.category = data.category || "لحوم";
        allProducts.push({ id: docSnap.id, ...data });
      });

      renderProducts();
      renderCarousel();
      renderAdminProductsList();
    });

    function renderCarousel() {
      const carouselContainer = document.getElementById('carousel-items-container');
      const carouselSection = document.getElementById('carousel-section');
      const activeProducts = allProducts.filter(p => p.available && p.img && p.img.trim() !== '');
      
      if (activeProducts.length === 0) {
        carouselSection.style.display = 'none';
        return;
      }

      carouselSection.style.display = 'block';
      carouselContainer.innerHTML = '';
      activeProducts.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = `carousel-item ${index === 0 ? 'active' : ''}`;
        item.innerHTML = `

            <h6 class="m-0 text-white fw-bold">${p.name} - ${p.price} ج.م</h6>
          </div>
        `;
        carouselContainer.appendChild(item);
      });
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      const filtered = currentSelectedCategory === "الكل" 
        ? allProducts 
        : allProducts.filter(p => (p.category || "لحوم") === currentSelectedCategory);

      filtered.forEach((p) => {

        col.className = 'col';

            <div>
              <img src="${p.img || 'https://via.placeholder.com/150'}" class="product-img rounded mb-2">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="badge ${p.available ? 'bg-success' : 'bg-danger'}">${p.available ? 'متوفر' : 'غير متوفر'}</span>
                <small class="badge bg-light text-dark border">${p.category || 'لحوم'}</small>

              <h6 class="fw-bold mb-1">${p.name}</h6>
              <small class="text-muted d-block">${p.weight || ''}</small>
              <div class="text-danger fw-bold mt-1">${p.price} ج.م</div>

            <button class="add-cart-btn btn btn-sm ${p.available ? 'btn-danger fw-bold' : 'btn-secondary'} w-100 mt-2" ${!p.available ? 'disabled' : ''}>
              + إضافة للسلة
            </button>
          </div>`;

        col.querySelector('.add-cart-btn').addEventListener('click', () => addToCart(p.name, p.price));
        grid.appendChild(col);
      });
    }

    function addToCart(name, price) {
      const existing = cart.find(item => item.name === name);
