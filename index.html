<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البراء للحوم المجمدة والمصنعات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 90px; }
        .header-bg { background-color: #8b0000; color: white; }
        .card-product { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .product-img { height: 130px; object-fit: cover; border-radius: 12px 12px 0 0; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); z-index: 1000; padding: 12px; }
    </style>
</head>
<body>

    <header class="header-bg p-3 shadow-sm sticky-top">
        <div class="container d-flex align-items-center justify-content-between">
            <div>
                <h6 class="m-0 fw-bold">البراء للحوم المجمدة والمصنعات</h6>
                <small class="text-white-50" style="font-size: 11px;">أعلى جودة وأفضل سعر</small>
            </div>
            <div class="d-flex gap-1">
                <a href="https://wa.me/201016462078" class="btn btn-sm btn-success"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                <button class="btn btn-sm btn-light text-dark fw-bold" onclick="toggleAdminPanel()"><i class="fa-solid fa-lock"></i> الإدارة</button>
            </div>
        </div>
    </header>

    <div class="container my-3">
        <!-- لوحة الإدارة السريعة (مخفية وتظهر عند الضغط) -->
        <div id="admin-box" class="card card-body bg-light border-danger mb-4 shadow" style="display: none;">
            <h5 class="fw-bold text-danger border-bottom pb-2">لوحة التحكم والإدارة</h5>
            <div id="admin-auth">
                <p>أدخل كلمة المرور لدخول اللوحة:</p>
                <div class="input-group mb-3">
                    <input type="password" id="pass-input" class="form-control" placeholder="كلمة المرور">
                    <button class="btn btn-danger" onclick="checkPass()">دخول</button>
                </div>
            </div>
            <div id="admin-content" style="display: none;">
                <h6 class="fw-bold mb-3">إضافة منتج جديد:</h6>
                <div class="row g-2">
                    <div class="col-6"><input type="text" id="p-name" class="form-control" placeholder="اسم المنتج"></div>
                    <div class="col-6"><input type="number" id="p-price" class="form-control" placeholder="السعر"></div>
                    <div class="col-6"><input type="text" id="p-cat" class="form-control" placeholder="القسم (مثال: لحوم)"></div>
                    <div class="col-6"><input type="text" id="p-unit" class="form-control" placeholder="الوحدة" value="1كجم"></div>
                    <div class="col-12"><input type="text" id="p-img" class="form-control" placeholder="رابط الصورة"></div>
                </div>
                <button class="btn btn-success mt-3 w-100 fw-bold" onclick="addNewProduct()">حفظ المنتج ونشره</button>
            </div>
        </div>

        <!-- قائمة المنتجات -->
        <h5 class="fw-bold mb-3 border-end border-4 border-danger pe-2">قائمة المنتجات</h5>
        <div class="row g-3" id="products-grid">
            <div class="text-center py-4 text-muted">اضغط على زرار الإدارة بالأعلى لتبدأ بإضافة أول منتج، أو انتظر جاري التحميل...</div>
        </div>
    </div>

    <div class="cart-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <small class="text-muted d-block">إجمالي الحساب:</small>
                <span class="fw-bold text-danger fs-5" id="cart-total">0 ج.م</span>
            </div>
            <button class="btn btn-success fw-bold px-4" onclick="checkout()"><i class="fa-solid fa-cart-shopping me-1"></i> إرسال الطلب</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHzA4NFfr1R18a-zWJweXk3QgBjWnSkbM",
            authDomain: "albaraameat-a6163.firebaseapp.com",
            projectId: "albaraameat-a6163",
            storageBucket: "albaraameat-a6163.firebasestorage.app",
            messagingSenderId: "825098464475",
            appId: "1:825098464475:web:e49118813a9e0113c6b0fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cartTotal = 0;

        window.toggleAdminPanel = function() {
            const box = document.getElementById("admin-box");
            box.style.display = box.style.display === "none" ? "block" : "none";
        }

        window.checkPass = function() {
            const pass = document.getElementById("pass-input").value;
            if (pass === "123") {
                document.getElementById("admin-auth").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
            } else {
                alert("كلمة المرور خطأ!");
            }
        }

        window.addNewProduct = async function() {
            const name = document.getElementById("p-name").value;
            const price = Number(document.getElementById("p-price").value);
            const category = document.getElementById("p-cat").value;
            const unit = document.getElementById("p-unit").value;
            const image = document.getElementById("p-img").value || 'https://via.placeholder.com/150';

            if (!name || !price) {
                alert("يرجى إدخال اسم المنتج والسعر على الأقل!");
                return;
            }

            await addDoc(collection(db, "products"), { name, price, category, unit, image });
            alert("تم إضافة المنتج بنجاح!");
            location.reload();
        }

        async function loadProducts() {
            const grid = document.getElementById("products-grid");
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    grid.innerHTML = `<div class="text-center py-4 text-muted">لا توجد منتجات مسجلة، افتح لوحة الإدارة وأضف منتجك الأول!</div>`;
                    return;
                }
                grid.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    let p = doc.data();
                    grid.innerHTML += `
                        <div class="col-6 col-md-4">
                            <div class="card card-product h-100">
                                <img src="${p.image}" class="product-img">
                                <div class="card-body p-2">
                                    <h6 class="fw-bold mb-1">${p.name}</h6>
                                    <div class="fw-bold text-danger mb-2">${p.price} ج.م</div>
                                    <button class="btn btn-sm btn-success w-100" onclick="window.addCart(${p.price})">+ إضافة للسلة</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                grid.innerHTML = `<div class="alert alert-danger">خطأ في التحميل: ${e.message}</div>`;
            }
        }

        window.addCart = function(price) {
            cartTotal += price;
            document.getElementById("cart-total").innerText = `${cartTotal} ج.م`;
        }

        window.checkout = function() {
            if (cartTotal === 0) { alert("السلة فارغة!"); return; }
            window.open(`https://wa.me/201016462078?text=أريد طلب منتجات بإجمالي: ${cartTotal} ج.م`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
