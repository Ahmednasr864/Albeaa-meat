<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر البراء للحوم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f8f9fa; padding-bottom: 140px; }
        .product-card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); background: #fff; }
        .admin-box { display: none; background: #fff; border: 2px solid #dc3545; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .store-logo { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid #dc3545; }
    </style>
</head>
<body>

    <!-- الهيدر واللوجو -->
    <header class="bg-white p-2 shadow-sm sticky-top mb-3">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <img id="header-logo" src="https://via.placeholder.com/60?text=Logo" class="store-logo">
                <div>
                    <h5 class="m-0 fw-bold text-danger">متجر البراء للحوم</h5>
                    <small class="text-muted" style="font-size: 11px;">أجود اللحوم الطازجة والمجمدة</small>
                </div>
            </div>
            <button class="btn btn-sm btn-outline-danger" onclick="toggleAdmin()"><i class="fa-solid fa-gear"></i> الإدارة</button>
        </div>
    </header>

    <div class="container">
        <!-- لوحة التحكم الشاملة -->
        <div id="admin-panel" class="admin-box shadow">
            <h5 class="text-danger fw-bold border-bottom pb-2 mb-3">⚙️ لوحة التحكم المتكاملة</h5>
            
            <!-- تسجيل الدخول للوحة التحكم -->
            <div id="admin-login-sec">
                <p class="small text-muted">أدخل كلمة المرور (الافتراضية: 123):</p>
                <div class="input-group mb-3">
                    <input type="password" id="admin-pass-input" class="form-control" placeholder="كلمة المرور">
                    <button class="btn btn-danger" onclick="checkAdminLogin()">دخول</button>
                </div>
            </div>

            <!-- محتوى الإدارة بعد الدخول -->
            <div id="admin-body-sec" style="display:none;">
                
                <!-- تغيير اللوجو -->
                <div class="card p-2 mb-3 bg-light border-0">
                    <h6 class="fw-bold text-dark">🖼️ تغيير لوجو المتجر</h6>
                    <input type="file" id="logo-file" class="form-control form-control-sm mb-2" accept="image/*">
                    <button class="btn btn-sm btn-dark" onclick="updateLogo()">تحديث اللوجو فوراً</button>
                </div>

                <!-- تغيير كلمة المرور -->
                <div class="card p-2 mb-3 bg-light border-0">
                    <h6 class="fw-bold text-dark">🔑 تغيير كلمة مرور الإدارة</h6>
                    <div class="input-group input-group-sm mb-2">
                        <input type="text" id="new-admin-pass" class="form-control" placeholder="كلمة المرور الجديدة">
                        <button class="btn btn-warning" onclick="changePassword()">حفظ الباسورد</button>
                    </div>
                </div>

                <!-- إضافة / تعديل منتج -->
                <div class="card p-2 mb-2 bg-light border-0">
                    <h6 class="fw-bold text-dark" id="form-title">➕ إضافة منتج جديد</h6>
                    <input type="hidden" id="edit-product-id">
                    <input type="text" id="p-name" class="form-control form-control-sm mb-2" placeholder="اسم المنتج">
                    <input type="number" id="p-price" class="form-control form-control-sm mb-2" placeholder="السعر (ج.م)">
                    <label class="small text-muted mb-1">صورة المنتج (اختر صورة ليتم ضغطها تلقائياً):</label>
                    <input type="file" id="p-img-file" class="form-control form-control-sm mb-2" accept="image/*">
                    
                    <button class="btn btn-success btn-sm w-100 fw-bold" onclick="saveOrUpdateProduct()" id="save-btn">حفظ المنتج في السحابة</button>
                    <button class="btn btn-secondary btn-sm w-100 mt-1" onclick="resetForm()" id="cancel-btn" style="display:none;">إلغاء التعديل</button>
                </div>

            </div>
        </div>

        <!-- قائمة المنتجات -->
        <h5 class="fw-bold mb-3">قائمة المنتجات</h5>
        <div class="row g-3" id="products-grid">
            <div class="text-center py-5">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2 text-muted">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- شريط السلة والطلب الثابت -->
    <div class="fixed-bottom bg-white shadow-lg p-3 border-top">
        <div class="container">
            <div class="row g-2 mb-2">
                <div class="col-6"><input type="text" id="cust-name" class="form-control form-control-sm" placeholder="اسم العميل"></div>
                <div class="col-6"><input type="tel" id="cust-phone" class="form-control form-control-sm" placeholder="رقم الموبايل"></div>
                <div class="col-12"><input type="text" id="cust-addr" class="form-control form-control-sm" placeholder="العنوان بالتفصيل"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="text-danger m-0 fw-bold">الإجمالي: <span id="total-price">0</span> ج.م</h5>
                <button class="btn btn-success fw-bold px-4" onclick="sendOrder()"><i class="fa-brands fa-whatsapp me-1"></i> إرسال الطلب</button>
            </div>
        </div>
    </div>

    <!-- سكربت الفايربيس والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateData, doc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        // ملاحظة: للتحديث نستخدم updateDoc
        import { updateDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const db = getFirestore(initializeApp({ projectId: "baraa-meat" }));
        let products = [], cart = {};

        // فتح وإغلاق لوحة التحكم
        window.toggleAdmin = () => {
            let box = document.getElementById("admin-panel");
            box.style.display = (box.style.display === "block") ? "none" : "block";
        };

        // التحقق من كلمة المرور
        window.checkAdminLogin = async () => {
            let passInput = document.getElementById("admin-pass-input").value;
            // جلب الباسورد المخزن في قاعدة البيانات أو استخدام 123 كافتراضي
            let passDoc = await getDoc(doc(db, "settings", "password"));
            let savedPass = passDoc.exists() ? passDoc.data().value : "123";

            if(passInput === savedPass) {
                document.getElementById("admin-login-sec").style.display = "none";
                document.getElementById("admin-body-sec").style.display = "block";
                alert("تم تسجيل الدخول بنجاح!");
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        };

        // تغيير كلمة المرور
        window.changePassword = async () => {
            let newPass = document.getElementById("new-admin-pass").value;
            if(!newPass) { alert("أدخل كلمة المرور الجديدة!"); return; }
            await setDoc(doc(db, "settings", "password"), { value: newPass });
            alert("تم تغيير كلمة المرور بنجاح!");
            document.getElementById("new-admin-pass").value = "";
        };

        // تحديث اللوجو
        window.updateLogo = () => {
            const file = document.getElementById('logo-file').files[0];
            if(!file) { alert("اختر صورة للوجو!"); return; }
            compressImage(file, 150, 0.5, async (compressedUrl) => {
                await setDoc(doc(db, "settings", "logo"), { value: compressedUrl });
                alert("تم تحديث اللوجو بنجاح!");
            });
        };

        // جلب الإعدادات (اللوجو) عند فتح الصفحة
        async function loadSettings() {
            let logoDoc = await getDoc(doc(db, "settings", "logo"));
            if(logoDoc.exists()) {
                document.getElementById("header-logo").src = logoDoc.data().value;
            }
        }
        loadSettings();

        // ضغط الصور تلقائياً (Canvas)
        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // حفظ أو تحديث المنتج
        window.saveOrUpdateProduct = () => {
            let id = document.getElementById("edit-product-id").value;
            let name = document.getElementById("p-name").value;
            let price = Number(document.getElementById("p-price").value);
            let file = document.getElementById('p-img-file').files[0];

            if(!name || !price) { alert("أدخل اسم المنتج والسعر!"); return; }

            if(file) {
                compressImage(file, 400, 0.6, async (imgUrl) => {
                    if(id) {
                        await updateDoc(doc(db, "products", id), { name, price, image: imgUrl });
                        alert("تم تعديل المنتج بنجاح!");
                    } else {
                        await addDoc(collection(db, "products"), { name, price, image: imgUrl });
                        alert("تمت الإضافة بنجاح!");
                    }
                    resetForm();
                });
            } else {
                // لو لم يختار صورة جديدة أثناء التعديل
                if(id) {
                    updateDoc(doc(db, "products", id), { name, price }).then(() => {
                        alert("تم التعديل بنجاح!");
                        resetForm();
                    });
                } else {
                    alert("الرجاء اختيار صورة للمنتج الجديد!");
                }
            }
        };

        // جلب المنتجات وتحديثها فوراً للجميع
        onSnapshot(collection(db, "products"), (snap) => {
            products = [];
            snap.forEach(d => products.push({id: d.id, ...d.data()}));
            renderGrid();
        });

        function renderGrid() {
            let grid = document.getElementById("products-grid");
            if(products.length === 0) {
                grid.innerHTML = `<div class="text-center py-4 text-muted">لا توجد منتجات حالياً. افتح الإدارة وأضف منتجك الأول!</div>`;
                return;
            }
            let html = "";
            products.forEach(p => {
                let q = cart[p.id] || 0;
                html += `
                <div class="col-6 col-md-4">
                    <div class="card product-card h-100 p-2">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" class="card-img-top rounded" height="120" style="object-fit:cover;">
                        <div class="card-body p-1 d-flex flex-column justify-content-between">
                            <div>
                                <h6 class="fw-bold mb-1" style="font-size:14px;">${p.name}</h6>
                                <span class="text-danger fw-bold">${p.price} ج.م</span>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-2 bg-light rounded p-1">
                                <button class="btn btn-sm btn-outline-danger px-2 py-0" onclick="updateCart('${p.id}', -1)">-</button>
                                <span class="fw-bold">${q}</span>
                                <button class="btn btn-sm btn-outline-success px-2 py-0" onclick="updateCart('${p.id}', 1)">+</button>
                            </div>
                            <!-- أزرار الإدارة الظاهرة للمنتج لو فاتح لوحة التحكم -->
                            <div class="mt-2 pt-1 border-top d-flex gap-1" id="admin-btns-${p.id}" style="display:none;">
                                <button class="btn btn-xs btn-primary w-50 py-0" style="font-size:11px;" onclick="prepEdit('${p.id}')">تعديل</button>
                                <button class="btn btn-xs btn-danger w-50 py-0" style="font-size:11px;" onclick="delProd('${p.id}')">حذف</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            grid.innerHTML = html;
        }

        window.updateCart = (id, val) => {
            cart[id] = Math.max(0, (cart[id] || 0) + val);
            renderGrid();
            calcTotal();
        };

        function calcTotal() {
            let total = 0;
            products.forEach(p => { if(cart[p.id]) total += p.price * cart[p.id]; });
            document.getElementById("total-price").innerText = total;
        }

        // تجهيز بيانات المنتج للتعديل
        window.prepEdit = (id) => {
            let p = products.find(x => x.id === id);
            if(!p) return;
            document.getElementById("edit-product-id").value = p.id;
            document.getElementById("p-name").value = p.name;
            document.getElementById("p-price").value = p.price;
            document.getElementById("form-title").innerText = "✏️ تعديل المنتج";
            document.getElementById("save-btn").innerText = التعديل الحفظ;
            document.getElementById("cancel-btn").style.display = "block";
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.resetForm = () => {
            document.getElementById("edit-product-id").value = "";
            document.getElementById("p-name").value = "";
            document.getElementById("p-price").value = "";
            document.getElementById("p-img-file").value = "";
            document.getElementById("form-title").innerText = "➕ إضافة منتج جديد";
            document.getElementById("save-btn").innerText = "حفظ المنتج في السحابة";
            document.getElementById("cancel-btn").style.display = "none";
        };

        window.delProd = async (id) => {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "products", id));
                alert("تم الحذف بنجاح!");
            }
        };

        window.sendOrder = () => {
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let addr = document.getElementById('cust-addr').value;

            if(!name || !phone) { alert("الرجاء كتابة الاسم ورقم الموبايل!"); return; }

            let msg = `🛒 *طلب جديد من متجر البراء:*%0A%0A👤 الاسم: ${name}%0A📞 الموبايل: ${phone}%0A📍 العنوان: ${addr}%0A%0A📦 *الطلبات:*%0A`;
            let total = 0;
            products.forEach(p => {
                if(cart[p.id] > 0) {
                    let sub = p.price * cart[p.id];
                    total += sub;
                    msg += `• ${p.name} (×${cart[p.id]}) = ${sub} ج.م%0A`;
                }
            });
            if(total === 0) { alert("السلة فارغة!"); return; }
            msg += `%0A💰 *الإجمالي الكلي:* ${total} ج.م`;
            window.open(`https://wa.me/201016462078?text=${msg}`, '_blank');
        };
    </script>
</body>
            </html>
