<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البراء للحوم المجمدة والمصنعات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 100px; font-family: sans-serif; }
        .header-bg { background-color: #8b0000; color: white; }
        .card-product { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #fff; }
        .product-img { height: 130px; object-fit: cover; border-radius: 12px 12px 0 0; width: 100%; background: #eee; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); z-index: 1000; padding: 12px; }
        .admin-box { display: none; background: #fff; border: 2px solid #8b0000; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header class="header-bg p-3 shadow-sm sticky-top">
        <div class="container d-flex align-items-center justify-content-between">
            <div>
                <h6 class="m-0 fw-bold">البراء للحوم المجمدة والمصنعات</h6>
                <small class="text-white-50" style="font-size: 11px;">أعلى جودة وأفضل سعر</small>
            </div>
            <div class="d-flex gap-1">
                <a href="tel:01016462078" class="btn btn-sm btn-warning text-dark"><i class="fa-solid fa-phone"></i></a>
                <a href="https://wa.me/201016462078" target="_blank" class="btn btn-sm btn-success"><i class="fa-brands fa-whatsapp"></i> 1</a>
                <a href="https://wa.me/201202888631" target="_blank" class="btn btn-sm btn-success"><i class="fa-brands fa-whatsapp"></i> 2</a>
                <button class="btn btn-sm btn-light text-danger fw-bold" onclick="toggleAdmin()"><i class="fa-solid fa-lock"></i> الإدارة</button>
            </div>
        </div>
    </header>

    <div class="container my-3">
        <div id="admin-panel" class="admin-box shadow">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                <h6 class="fw-bold text-danger m-0">لوحة التحكم السحابية (baraa-meat)</h6>
                <button class="btn-close" onclick="toggleAdmin()"></button>
            </div>
            
            <div id="admin-login">
                <p class="small text-muted mb-2">أدخل كلمة المرور (123):</p>
                <div class="input-group mb-2">
                    <input type="password" id="pass-val" class="form-control" placeholder="كلمة المرور">
                    <button class="btn btn-danger" onclick="login()">دخول</button>
                </div>
            </div>

            <div id="admin-body" style="display:none;">
                <h6 class="fw-bold mb-2">إضافة منتج جديد:</h6>
                <div class="row g-2 mb-2">
                    <div class="col-6"><input type="text" id="p-name" class="form-control" placeholder="اسم المنتج"></div>
                    <div class="col-6"><input type="number" id="p-price" class="form-control" placeholder="السعر"></div>
                    <div class="col-6"><input type="text" id="p-unit" class="form-control" placeholder="الوحدة" value="1كجم"></div>
                    <div class="col-6"><input type="text" id="p-img" class="form-control" placeholder="رابط الصورة"></div>
                </div>
                <button class="btn btn-success w-100 fw-bold mb-3" onclick="saveProduct()">حفظ فوراً في السحابة</button>
                
                <h6 class="fw-bold border-top pt-2">المنتجات الحالية:</h6>
                <div id="admin-list" class="list-group" style="max-height: 200px; overflow-y: auto;"></div>
            </div>
        </div>

        <h5 class="fw-bold mb-3 border-end border-4 border-danger pe-2">قائمة المنتجات</h5>
        <div class="row g-3" id="products-grid">
            <div class="text-center py-5">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2 text-muted">جاري الاتصال بالسحابة...</p>
            </div>
        </div>
    </div>

    <div class="cart-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <small class="text-muted d-block">إجمالي حسابك:</small>
                <span class="fw-bold text-danger fs-5" id="cart-total">0 ج.م</span>
            </div>
            <button class="btn btn-success fw-bold px-4" onclick="checkout()"><i class="fa-solid fa-cart-shopping me-1"></i> إرسال الطلب</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // ربط بمشروع baraa-meat
        const firebaseConfig = { projectId: "baraa-meat" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let cart = {};

        window.toggleAdmin = function() {
            let box = document.getElementById("admin-panel");
            box.style.display = (box.style.display === "block") ? "none" : "block";
        }

        window.login = function() {
            if(document.getElementById("pass-val").value === "123") {
                document.getElementById("admin-login").style.display = "none";
                document.getElementById("admin-body").style.display = "block";
            } else { alert("كلمة المرور خطأ!"); }
        }

        // الاستماع الفوري للتحديثات
        onSnapshot(collection(db, "products"), (snap) => {
            products = [];
            snap.forEach(d => products.push({ id: d.id, ...d.data() }));
            renderGrid();
            renderAdminList();
        }, (err) => {
            console.error(err);
            document.getElementById("products-grid").innerHTML = `<div class="alert alert-danger text-center">حدث خطأ أثناء تحميل المنتجات.</div>`;
        });

        function renderGrid() {
            let grid = document.getElementById("products-grid");
            if(products.length === 0) {
                grid.innerHTML = `<div class="text-center py-4 text-muted">لا توجد منتجات سحابية بعد. اضغط على الإدارة وأضف منتجك الأول!</div>`;
                return;
            }
            grid.innerHTML = "";
            products.forEach(p => {
                let q = cart[p.id] || 0;
                let img = p.image || 'https://via.placeholder.com/150?text=البراء';
                grid.innerHTML += `
                    <div class="col-6 col-md-4">
                        <div class="card card-product h-100">
                            <img src="${img}" class="product-img">
                            <div class="card-body p-2 d-flex flex-column justify-content-between">
                                <div>
                                    <h6 class="fw-bold mb-1">${p.name}</h6>
                                    <small class="text-muted d-block mb-1">${p.unit || '1كجم'}</small>
                                    <div class="fw-bold text-danger mb-2">${p.price} ج.م</div>
                                </div>
                                <div class="d-flex align-items-center justify-content-between bg-light rounded p-1">
                                    <button class="btn btn-sm btn-danger px-2" onclick="changeQty('${p.id}', -1)">-</button>
                                    <span class="fw-bold">${q}</span>
                                    <button class="btn btn-sm btn-success px-2" onclick="changeQty('${p.id}', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderAdminList() {
            let list = document.getElementById("admin-list");
            if(!list) return;
            list.innerHTML = "";
            products.forEach(p => {
                list.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center p-2">
                        <small><b>${p.name}</b> (${p.price}ج)</small>
                        <button class="btn btn-sm btn-danger py-0" onclick="delProd('${p.id}')">حذف</button>
                    </div>
                `;
            });
        }

        window.saveProduct = async function() {
            let name = document.getElementById("p-name").value;
            let price = Number(document.getElementById("p-price").value);
            let unit = document.getElementById("p-unit").value;
            let image = document.getElementById("p-img").value;

            if(!name || !price) { alert("ادخل الاسم والسعر!"); return; }

            await addDoc(collection(db, "products"), { name, price, unit, image });
            alert("تمت الإضافة السحابية بنجاح!");
            document.getElementById("p-name").value = "";
            document.getElementById("p-price").value = "";
        }

        window.delProd = async function(id) {
            if(confirm("تأكيد المسح؟")) await deleteDoc(doc(db, "products", id));
        }

        window.changeQty = function(id, change) {
            if(!cart[id]) cart[id] = 0;
            cart[id] += change;
            if(cart[id] <= 0) delete cart[id];
            renderGrid();
            calcTotal();
        }

        function calcTotal() {
            let tot = 0;
            for(let id in cart) {
                let p = products.find(x => x.id === id);
                if(p) tot += p.price * cart[id];
            }
            document.getElementById("cart-total").innerText = tot + " ج.م";
        }

        window.checkout = function() {
            let text = "🛒 *طلب جديد من متجر البراء:*%0A%0A";
            let tot = 0;
            for(let id in cart) {
                let p = products.find(x => x.id === id);
                if(p) {
                    let sub = p.price * cart[id];
                    tot += sub;
                    text += `• ${p.name} (${cart[id]} ${p.unit||'كجم'}) = ${sub} ج.م%0A`;
                }
            }
            if(tot === 0) { alert("السلة فارغة!"); return; }
            text += `%0A💰 *الإجمالي:* ${tot} ج.م`;
            window.open(`https://wa.me/201016462078?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
