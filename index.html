<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>البراء للحوم - إدارة ذكية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <!-- لوحة التحكم -->
    <div id="admin-panel" class="card p-3 mb-4 shadow" style="display:none;">
        <h5 class="text-danger">إضافة منتج مع ضغط الصور</h5>
        <input type="text" id="p-name" class="form-control mb-2" placeholder="اسم المنتج">
        <input type="number" id="p-price" class="form-control mb-2" placeholder="السعر">
        <!-- حقل اختيار الصورة -->
        <input type="file" id="p-img-file" class="form-control mb-2" accept="image/*">
        <button class="btn btn-success w-100" onclick="processAndSave()">ضغط وحفظ المنتج</button>
    </div>

    <div class="row g-3" id="products-grid"></div>
</div>

<!-- السلة -->
<div class="fixed-bottom bg-white p-3 border-top">
    <div class="container">
        <input type="text" id="cust-name" class="form-control form-control-sm mb-1" placeholder="الاسم">
        <div class="d-flex justify-content-between">
            <h6>الإجمالي: <span id="total-price">0</span> ج.م</h6>
            <button class="btn btn-success btn-sm" onclick="sendOrder()">واتساب</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const db = getFirestore(initializeApp({ projectId: "baraa-meat" }));
    let products = [], cart = {};

    onSnapshot(collection(db, "products"), (snap) => {
        products = [];
        snap.forEach(d => products.push({id: d.id, ...d.data()}));
        render();
    });

    // دالة ضغط الصورة
    window.processAndSave = () => {
        const file = document.getElementById('p-img-file').files[0];
        if (!file) { alert("اختر صورة!"); return; }
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400; // عرض الصورة المضغوطة
                const scale = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                // الضغط بنسبة 0.6 (جودة 60%)
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                saveProductToDB(compressedDataUrl);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    async function saveProductToDB(imgUrl) {
        await addDoc(collection(db, "products"), {
            name: document.getElementById("p-name").value,
            price: Number(document.getElementById("p-price").value),
            image: imgUrl
        });
        alert("تم الحفظ (صورة مضغوطة)!");
    }

    function render() {
        let html = "";
        products.forEach(p => {
            html += `<div class="col-6"><div class="card p-2"><img src="${p.image}" height="100"><p>${p.name}</p><p class="text-danger">${p.price}</p></div></div>`;
        });
        document.getElementById("products-grid").innerHTML = html;
    }
</script>

<button class="btn btn-link fixed-top" onclick="document.getElementById('admin-panel').style.display='block'">⚙️</button>
</body>
</html>
